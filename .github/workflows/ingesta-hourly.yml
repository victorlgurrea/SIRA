# Ingesta horaria en el servidor Render (GitHub Actions).
# Secrets en el repo (Settings → Secrets → Actions):
#   SIRA_API_URL     = URL exacta de sira-api en Render (la del panel; suele llevar sufijo)
#   SIRA_CRON_SECRET = mismo valor que CRON_SECRET en Render (sira-api)
#
# En plan Free, un POST directo suele devolver 503 (servicio hibernado).
# Este workflow despierta la API y reintenta antes de lanzar la ingesta.
#
# Frecuencia: cada 3h (no cada hora). El plan Free del workspace tiene
# 750 h de instancia/mes compartidas entre sira-api y sira-dashboard;
# despertar la API con más frecuencia agota esa cuota antes de fin de mes
# (ver incidente: suspensión el 31/07 por 750/750 h usadas).

name: Ingesta cada 3h SIRA

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write   # necesario para crear/actualizar releases (snapshot)

jobs:
  ingesta:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Despertar API y disparar ingesta
        env:
          API_URL: ${{ secrets.SIRA_API_URL }}
          CRON_SECRET: ${{ secrets.SIRA_CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${API_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "Faltan secrets SIRA_API_URL o SIRA_CRON_SECRET"
            exit 1
          fi
          API_URL="${API_URL%/}"

          echo "Despertando API (GET /)…"
          for i in 1 2 3 4 5 6; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 60 "${API_URL}/" || true)
            echo "  intento $i → HTTP $code"
            if [ "$code" = "200" ] || [ "$code" = "404" ]; then
              break
            fi
            sleep 15
          done

          echo "POST /api/cron/ingesta…"
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o /tmp/sira_ingesta_body.txt -w "%{http_code}" \
              --max-time 600 \
              -X POST "${API_URL}/api/cron/ingesta" \
              -H "X-Cron-Secret: ${CRON_SECRET}" \
              -H "Content-Type: application/json" || true)
            echo "  intento $i → HTTP $code"
            body="$(head -c 800 /tmp/sira_ingesta_body.txt || true)"
            if [ "$code" = "200" ] || [ "$code" = "202" ]; then
              echo "$body"
              echo
              break
            fi
            if [ "$code" = "503" ] || [ "$code" = "502" ] || [ "$code" = "504" ]; then
              sleep 20
              continue
            fi
            echo "Respuesta no reintentable:"
            echo "$body"
            echo
            exit 1
          done

      # Esperar a que la ingesta en background termine y guardar snapshot
      - name: Esperar ingesta y guardar snapshot
        env:
          API_URL: ${{ secrets.SIRA_API_URL }}
          CRON_SECRET: ${{ secrets.SIRA_CRON_SECRET }}
          SIRA_DASHBOARD_URL: ${{ secrets.SIRA_DASHBOARD_URL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API_URL="${API_URL%/}"
          GITHUB_API_URL="https://api.github.com"

          echo "Leyendo generado_en previo…"
          body0=$(curl -sS --max-time 30 "${API_URL}/api/status" \
            -H "X-Cron-Secret: ${CRON_SECRET}" 2>/dev/null || echo '{}')
          gen_before=$(echo "$body0" | python3 -c "import sys,json; print(json.load(sys.stdin).get('generado_en') or '')" 2>/dev/null || echo "")
          echo "generado_en previo=$gen_before"

          echo "Esperando a que la ingesta termine con un generado_en NUEVO…"
          gen=""
          for i in $(seq 1 60); do
            sleep 20
            body=$(curl -sS --max-time 30 "${API_URL}/api/status" \
              -H "X-Cron-Secret: ${CRON_SECRET}" 2>/dev/null || echo '{}')
            running=$(echo "$body" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('ingesta',{}).get('running',True))" 2>/dev/null || echo "True")
            gen=$(echo "$body" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('generado_en') or '')" 2>/dev/null || echo "")
            echo "  check $i: running=$running generado_en=$gen"
            if [ "$running" = "False" ] && [ -n "$gen" ] && [ "$gen" != "$gen_before" ]; then
              echo "Ingesta completa."
              break
            fi
          done
          if [ -z "$gen" ] || [ "$gen" = "$gen_before" ]; then
            echo "La ingesta no produjo un generado_en nuevo; no se sube snapshot viejo"
            exit 1
          fi

          echo "Descargando dashboard JSON del API…"
          # --compressed: curl descomprime Content-Encoding (si no, se sube doble gzip).
          curl -sS --compressed --max-time 120 \
            "${API_URL}/api/dashboard" -o /tmp/dashboard_data.json
          size=$(wc -c < /tmp/dashboard_data.json)
          echo "Descargado: ${size} bytes"
          if [ "$size" -lt 100 ]; then
            echo "JSON demasiado pequeño; no se sube snapshot"
            exit 1
          fi
          # Validar que es JSON real (no gzip residual)
          gen=$(python3 -c "import json; d=json.load(open('/tmp/dashboard_data.json',encoding='utf-8')); print(d.get('generado_en') or '')" || true)
          if [ -z "$gen" ]; then
            echo "El body no es un dashboard JSON válido (¿doble gzip / HTML?)"
            head -c 120 /tmp/dashboard_data.json | xxd || true
            exit 1
          fi
          echo "generado_en=$gen"

          # Comprimir UNA vez
          gzip -9 -k -f /tmp/dashboard_data.json
          gz_size=$(wc -c < /tmp/dashboard_data.json.gz)
          echo "Comprimido: ${gz_size} bytes"

          # Subir como release asset «latest-data»
          REPO="${GITHUB_REPOSITORY}"
          TAG="latest-data"
          ASSET="dashboard_data.json.gz"

          # Obtener o crear release
          rel_id=$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" \
            "${GITHUB_API_URL}/repos/${REPO}/releases/tags/${TAG}" \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))" 2>/dev/null || echo "")

          if [ -z "$rel_id" ]; then
            echo "Creando release ${TAG}…"
            rel_id=$(curl -sS -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Content-Type: application/json" \
              "${GITHUB_API_URL}/repos/${REPO}/releases" \
              -d "{\"tag_name\":\"${TAG}\",\"name\":\"Último snapshot\",\"prerelease\":true}" \
              | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          fi

          # Borrar asset anterior
          for asset_id in $(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" \
            "${GITHUB_API_URL}/repos/${REPO}/releases/${rel_id}/assets" \
            | python3 -c "import sys,json; [print(a['id']) for a in json.load(sys.stdin) if a['name']=='${ASSET}']" 2>/dev/null); do
            curl -sS -X DELETE -H "Authorization: Bearer ${GH_TOKEN}" \
              "${GITHUB_API_URL}/repos/${REPO}/releases/assets/${asset_id}" || true
          done

          # Subir nuevo
          echo "Subiendo snapshot…"
          upload_url="https://uploads.github.com/repos/${REPO}/releases/${rel_id}/assets?name=${ASSET}"
          curl -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Content-Type: application/gzip" \
            --data-binary @/tmp/dashboard_data.json.gz \
            "${upload_url}" | python3 -c "import sys,json; d=json.load(sys.stdin); print('Asset:', d.get('name'), d.get('size'), 'bytes')"
          echo "Snapshot subido ✓"

          DASHBOARD_URL="${SIRA_DASHBOARD_URL:-https://sira-dashboard.onrender.com}"
          DASHBOARD_URL="${DASHBOARD_URL%/}"
          echo "Forzando restore-snapshot en el dashboard (${DASHBOARD_URL})…"
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o /tmp/sira_dash_restore.txt -w "%{http_code}" --max-time 120 \
              -X POST "${DASHBOARD_URL}/api/cron/restore-snapshot" \
              -H "X-Cron-Secret: ${CRON_SECRET}" || true)
            echo "  restore dashboard intento $i → HTTP $code $(head -c 200 /tmp/sira_dash_restore.txt || true)"
            if [ "$code" = "200" ]; then
              break
            fi
            sleep 15
          done
