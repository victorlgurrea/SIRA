# Ingesta horaria en el servidor Render (GitHub Actions).
# Secrets en el repo (Settings → Secrets → Actions):
#   SIRA_API_URL     = https://sira-api.onrender.com
#   SIRA_CRON_SECRET = mismo valor que CRON_SECRET en Render (sira-api)

name: Ingesta horaria SIRA

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  ingesta:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar ingesta en Render
        run: |
          curl -sfS -X POST "${{ secrets.SIRA_API_URL }}/api/cron/ingesta" \
            -H "X-Cron-Secret: ${{ secrets.SIRA_CRON_SECRET }}"
